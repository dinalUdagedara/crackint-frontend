name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (errors fail, warnings reported)
        run: npx eslint .
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway CI container: trust auth, so no credentials live in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: crackint_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Backend: deterministic fake LLM, nothing external.
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_NAME: crackint_e2e
      LLM_FAKE_RESPONSES: "true"
      OPENAI_API_KEY: fake
      SESSION_QA_AGENT_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000
      # Frontend
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # Backend branch: release PRs (develop -> main) test against backend develop (its matching
      # release is not on main yet); other PRs into main use main; everything else uses develop.
      # Merge the backend release before the frontend one.
      - name: Check out backend (matching branch)
        uses: actions/checkout@v4
        with:
          repository: dinalUdagedara/crackint-backend
          ref: ${{ github.event_name == 'pull_request' && (github.head_ref == 'develop' && 'develop' || (github.base_ref == 'main' && 'main' || 'develop')) || (github.ref_name == 'main' && 'main' || 'develop') }}
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend (CPU-only torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Migrate and start backend
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn app.main:get_app --factory --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/v1/health && break; sleep 1; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          npm run build

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report and backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
            backend.log
          retention-days: 7
